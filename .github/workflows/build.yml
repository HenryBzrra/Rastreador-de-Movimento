name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: windows
          - os: macos-latest
            nome: macos
          - os: ubuntu-latest
            nome: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bibliotecas do Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0 libxcb-xkb1 libdbus-1-3

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Compilar (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --onefile --windowed --name RastreadorMouse --collect-submodules pynput rastreador_mouse.py

      - name: Compilar (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name RastreadorMouse --collect-submodules pynput rastreador_mouse.py
          cd dist
          zip -r RastreadorMouse-macos.zip RastreadorMouse.app

      - name: Compilar (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --onefile --name RastreadorMouse --collect-submodules pynput rastreador_mouse.py
          mv dist/RastreadorMouse dist/RastreadorMouse-linux

      - uses: actions/upload-artifact@v4
        with:
          name: RastreadorMouse-${{ matrix.nome }}
          path: |
            dist/RastreadorMouse.exe
            dist/RastreadorMouse-macos.zip
            dist/RastreadorMouse-linux
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: arquivos
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: arquivos/*
          generate_release_notes: true
